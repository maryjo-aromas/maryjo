<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi carrito | MaryJo Aromas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #faf8f5;
            color: #49382f;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .cart-page {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 35px 20px 60px;
        }

        .cart-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .cart-brand {
            font-family: Georgia, serif;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .cart-heading {
            font-family: Georgia, serif;
            font-size: 30px;
            font-weight: normal;
            margin: 25px 0 10px;
        }

        .cart-intro {
            color: #81756c;
            font-size: 14px;
            line-height: 1.6;
        }

        .cart-back {
            display: inline-block;
            margin-top: 15px;
            font-size: 14px;
            color: #806b59;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .cart-list {
            display: grid;
            gap: 16px;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 115px minmax(0, 1fr);
            gap: 18px;
            padding: 16px;
            background: #fff;
            border: 1px solid #eee5dc;
            border-radius: 12px;
        }

        .cart-item img {
            width: 115px;
            height: 125px;
            object-fit: cover;
            border-radius: 8px;
            background: #f5f0e9;
        }

        .cart-item-info {
            min-width: 0;
        }

        .cart-item-name {
            font-family: Georgia, serif;
            font-size: 18px;
            margin: 2px 0 8px;
        }

        .cart-item-details {
            color: #786d64;
            font-size: 13px;
            line-height: 1.7;
        }

        .cart-item-price {
            margin-top: 9px;
            font-weight: bold;
            font-size: 16px;
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 13px;
        }

        .cart-quantity {
            display: flex;
            align-items: center;
            border: 1px solid #e5d9cc;
            border-radius: 7px;
            overflow: hidden;
        }

        .cart-quantity button {
            width: 32px;
            height: 30px;
            border: none;
            background: #f5f0e9;
            color: #49382f;
            font-size: 18px;
            cursor: pointer;
        }

        .cart-quantity span {
            min-width: 32px;
            text-align: center;
            font-size: 14px;
        }

        .cart-remove {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 12px;
            border: 1px solid #e5d9cc;
            border-radius: 7px;
            background: #faf8f5;
            color: #806b59;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }
        
        .cart-remove:hover {
            background: #eee5dc;
            color: #49382f;
        }

        .cart-summary {
            margin-top: 25px;
            padding: 22px;
            background: #f3ede5;
            border: 1px solid #e9dfd2;
            border-radius: 12px;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .cart-total-amount {
            font-size: 22px;
        }

        .cart-button {
            display: block;
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: 8px;
            background: #49382f;
            color: white;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s ease;
        }

        .cart-button:hover {
            background: #675143;
        }

        .cart-button-secondary {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 11px;
            border: 1px solid #d9cbbd;
            border-radius: 8px;
            background: transparent;
            color: #78675a;
            cursor: pointer;
            font-size: 13px;
        }

        /* ========================================
           BOTONES DEL RESUMEN DEL CARRITO
        ======================================== */
        
        .cart-summary .btn-whatsapp {
            display: block;
            width: 100%;
            padding: 15px 18px;
            border: 1px solid #49382f;
            border-radius: 8px;
            background: #49382f;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        
        .cart-summary .btn-whatsapp:hover {
            background: #675143;
        }
        
        .cart-summary .btn-clear {
            display: block;
            width: 100%;
            margin-top: 11px;
            padding: 12px 18px;
            border: 1px solid #d9cbbd;
            border-radius: 8px;
            background: #faf8f5;
            color: #806b59;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        
        .cart-summary .btn-clear:hover {
            background: #eee5dc;
        }

        .cart-empty {
            padding: 45px 20px;
            text-align: center;
            background: #fff;
            border: 1px solid #eee5dc;
            border-radius: 12px;
        }

        .cart-empty-icon {
            font-size: 35px;
            margin-bottom: 12px;
        }

        .cart-empty h2 {
            font-family: Georgia, serif;
            font-weight: normal;
            font-size: 23px;
        }

        .cart-empty p {
            color: #81756c;
            font-size: 14px;
            line-height: 1.6;
        }

        .cart-footer {
            margin-top: 35px;
            text-align: center;
            color: #9a8c80;
            font-size: 12px;
        }

        @media (max-width: 520px) {
            .cart-page {
                padding: 25px 13px 45px;
            }

            .cart-heading {
                font-size: 26px;
            }

            .cart-item {
                grid-template-columns: 90px minmax(0, 1fr);
                gap: 12px;
                padding: 12px;
            }

            .cart-item img {
                width: 90px;
                height: 105px;
            }

            .cart-item-name {
                font-size: 16px;
            }

            .cart-item-details {
                font-size: 12px;
            }

            .cart-item-price {
                font-size: 15px;
            }

            .cart-item-actions {
                gap: 8px;
            }

            .cart-summary {
                padding: 17px;
            }
        }
    </style>
</head>

<body>

    <main class="cart-page">

        <header class="cart-header">
            <div class="cart-brand">MaryJo Aromas</div>

            <h1 class="cart-heading">Mi carrito</h1>

            <p class="cart-intro">
                Aquí puedes revisar tus velas y personalizaciones
                antes de realizar tu pedido.
            </p>

            <a href="index.html" class="cart-back">
                ← Seguir explorando el catálogo
            </a>
        </header>

        <section id="cart-content">
            <!-- Los productos se muestran aquí -->
        </section>

        <footer class="cart-footer">
            © 2025 MaryJo Aromas. Todos los derechos reservados.
        </footer>

    </main>

    <script>
        const CART_KEY = "carrito";
        const WHATSAPP_NUMBER = "5353810462";
        
        const cartContent = document.getElementById("cart-content");
        
        function obtenerCarrito() {
          try {
            return JSON.parse(localStorage.getItem(CART_KEY)) || [];
          } catch (error) {
            return [];
          }
        }
        
        function guardarCarrito(carrito) {
          localStorage.setItem(CART_KEY, JSON.stringify(carrito));
        }
        
        function escaparHTML(valor) {
          return String(valor ?? "").replace(/[&<>"']/g, caracter => {
            const caracteres = {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;"
            };
            return caracteres[caracter];
          });
        }
        
        function numeroPrecio(valor) {
          const numero = Number(valor);
          return Number.isFinite(numero) ? numero : 0;
        }
        
        function formatoPrecio(valor) {
          return numeroPrecio(valor).toLocaleString("es-ES") + " CUP";
        }
        
        function renderizarCarrito() {
          if (!cartContent) return;
        
          const carrito = obtenerCarrito();
        
          if (carrito.length === 0) {
            cartContent.innerHTML = `
              <div class="cart-empty">
                <p>Tu carrito está vacío.</p>
                <a href="index.html" class="btn">Volver a la tienda</a>
              </div>
            `;
            return;
          }
        
          let totalPedido = 0;
        
          const productosHTML = carrito.map((item, index) => {
            const nombre = item.producto || "Vela artesanal";
            const imagen = item.imagen
              ? `<img src="${escaparHTML(item.imagen)}" alt="${escaparHTML(nombre)}" class="cart-image">`
              : "";
        
            const cantidad = Math.max(1, parseInt(item.cantidad, 10) || 1);
            const total = numeroPrecio(item.total);
            totalPedido += total;
        
            const detalles = [];
        
            if (item.color) {
              detalles.push(`<p><strong>Color:</strong> ${escaparHTML(item.color)}</p>`);
            }
        
            if (item.tono) {
              const tono = item.tono === "base-oscura"
                ? "Base oscura, parte superior clara"
                : "Color uniforme";
              detalles.push(`<p><strong>Tono:</strong> ${escaparHTML(tono)}</p>`);
            }
        
            if (item.aroma) {
              detalles.push(`<p><strong>Aroma:</strong> ${escaparHTML(item.aroma)}</p>`);
            }
        
            if (item.numeros) {
              detalles.push(`<p><strong>Números:</strong> ${escaparHTML(item.numeros)}</p>`);
            }
        
            if (item.empaque) {
              detalles.push(`<p><strong>Empaque:</strong> ${escaparHTML(item.empaque)}</p>`);
            }
        
            return `
              <article class="cart-item">
                ${imagen}
                <div class="cart-item-details">
                  <h3>${escaparHTML(nombre)}</h3>
                  ${detalles.join("")}
                  <p><strong>Precio:</strong> <span class="cart-item-total">${formatoPrecio(total)}</span></p>
                  <div class="cart-item-actions">
                  <div class="cart-quantity">
                    <button type="button" class="quantity-minus" data-index="${index}" aria-label="Restar una unidad">−</button>
                    <span>${cantidad}</span>
                    <button type="button" class="quantity-plus" data-index="${index}" aria-label="Añadir una unidad">+</button>
                  </div>
                
                  <button type="button" class="cart-remove" data-index="${index}" aria-label="Eliminar producto">
                    <span>Eliminar</span>
                  </button>
                </div>
                </div>
              </article>
            `;
          }).join("");
        
          cartContent.innerHTML = `
            <div class="cart-list">
              ${productosHTML}
            </div>
            <div class="cart-summary">
              <p class="cart-total"><strong>Total del pedido:</strong> ${formatoPrecio(totalPedido)}</p>
              <button type="button" id="send-whatsapp" class="btn btn-whatsapp">
                Comprar por WhatsApp
              </button>
              <button type="button" id="clear-cart" class="btn btn-clear">
                Vaciar carrito
              </button>
            </div>
          `;
        }
        
        function cambiarCantidad(index, cambio) {
          const carrito = obtenerCarrito();
          const item = carrito[index];
        
          if (!item) return;
        
          const cantidadAnterior = Math.max(1, parseInt(item.cantidad, 10) || 1);
          const nuevaCantidad = cantidadAnterior + cambio;
        
          if (nuevaCantidad < 1) return;
        
          const precioUnidad = numeroPrecio(item.precio);
          const totalAnterior = numeroPrecio(item.total);
        
          // El total guardado incluye el posible extra fijo del empaque.
          const extraEmpaque = totalAnterior - (precioUnidad * cantidadAnterior);
        
          item.cantidad = nuevaCantidad;
          item.total = (precioUnidad * nuevaCantidad) + extraEmpaque;
        
          guardarCarrito(carrito);
          renderizarCarrito();
        }
        
        function eliminarProducto(index) {
          const carrito = obtenerCarrito();
          carrito.splice(index, 1);
          guardarCarrito(carrito);
          renderizarCarrito();
        }
        
        function vaciarCarrito() {
          localStorage.removeItem(CART_KEY);
          renderizarCarrito();
        }
        
        function enviarPedidoWhatsApp() {
          const carrito = obtenerCarrito();
        
          if (carrito.length === 0) return;
        
          let totalPedido = 0;
          let mensaje = "¡Hola! Quiero realizar el siguiente pedido de velas:\n\n";
        
          carrito.forEach((item, index) => {
            const cantidad = Math.max(1, parseInt(item.cantidad, 10) || 1);
            const total = numeroPrecio(item.total);
            totalPedido += total;
        
            mensaje += `${index + 1}. ${item.producto || "Vela artesanal"}\n`;
            mensaje += `Cantidad: ${cantidad}\n`;
        
            if (item.color) mensaje += `Color: ${item.color}\n`;
            if (item.tono) {
              mensaje += `Tono: ${
                item.tono === "base-oscura"
                  ? "Base oscura, parte superior clara"
                  : "Color uniforme"
              }\n`;
            }
            if (item.aroma) mensaje += `Aroma: ${item.aroma}\n`;
            if (item.numeros) mensaje += `Números: ${item.numeros}\n`;
            if (item.empaque) mensaje += `Empaque: ${item.empaque}\n`;
        
            mensaje += `Precio: ${formatoPrecio(total)}\n\n`;
          });
        
          mensaje += `TOTAL DEL PEDIDO: ${formatoPrecio(totalPedido)}\n\n`;
          mensaje += "¡Gracias!";
        
          const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(mensaje)}`;
          window.open(url, "_blank");
        }
        
        // Un solo listener para los botones de los productos y del resumen.
        if (cartContent) {
          cartContent.addEventListener("click", function (evento) {
            const boton = evento.target.closest("button");
            if (!boton) return;
        
            const index = Number(boton.dataset.index);
        
            if (boton.classList.contains("quantity-minus")) {
              cambiarCantidad(index, -1);
            } else if (boton.classList.contains("quantity-plus")) {
              cambiarCantidad(index, 1);
            } else if (boton.classList.contains("cart-remove")) {
              eliminarProducto(index);
            } else if (boton.id === "send-whatsapp") {
              enviarPedidoWhatsApp();
            } else if (boton.id === "clear-cart") {
              vaciarCarrito();
            }
          });
        }
        
        renderizarCarrito();

    </script>

</body>
</html>
